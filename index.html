<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Ulang Tahun! 🎂</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #001f3f 0%, #0074D9 50%, #00c6ff 100%);
      overflow: hidden;
      position: relative;
    }

    /* Gelembung */
    .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(1);      opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0;   }
    }

    /* Bintang */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      width: 4px; height: 4px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
      opacity: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%       { opacity: 1; transform: scale(1.2); }
    }

    /* Konfeti */
    .confetti-piece {
      position: fixed;
      top: -20px;
      border-radius: 2px;
      animation: confettiFall linear infinite;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);     opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* Kartu */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(60px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cake {
      font-size: 80px;
      display: block;
      animation: bounce 1.6s ease-in-out infinite;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
      line-height: 1.2;
      margin-bottom: 10px;
      animation: fadeUp 1s 0.3s ease both;
    }
    h1 span.name {
      color: #ffe066;
      display: block;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      animation: fadeUp 1s 0.5s ease both;
    }

    /* Tombol utama */
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: linear-gradient(90deg, #ffe066, #ff9f43);
      color: #001f3f;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(255,159,67,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 1s 0.7s ease both;
      margin: 6px;
    }
    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 32px rgba(255,159,67,0.6);
    }
    .btn:active { transform: scale(0.97); }

    /* Tombol sekunder ke halaman pesan */
    .btn-secondary {
      display: inline-block;
      padding: 13px 34px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      animation: fadeUp 1s 0.9s ease both;
      margin: 6px;
    }
    .btn-secondary:hover {
      transform: translateY(-3px) scale(1.03);
      background: rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .btn-secondary:active { transform: scale(0.97); }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      animation: fadeUp 1s 1.1s ease both;
    }
  </style>
</head>
<body>

  <div class="bubbles" id="bubbles"></div>
  <div class="stars" id="stars"></div>
  <div id="confetti"></div>

  <div class="card">
    <span class="cake">🎂</span>

    <h1>
      Selamat Ulang Tahun<br />
      <span class="name">✨ apin tersayang ✨</span>
    </h1>

    <p class="subtitle">Hari yang paling spesial buat kamu 
      03 oktober 2026 🎉</p>

    <div class="btn-group">
      <a class="btn" href="#" onclick="launchConfetti(); return false;">
        🎊 Rayakan Sekarang!
      </a>
      <a class="btn-secondary" href="pesan.html">
        💌 Baca Pesannya
      </a>
    </div>

    <p class="footer">Dengan penuh hormat untukmu apin 💙</p>
  </div>

  <script>
    // Gelembung
    const bubblesContainer = document.getElementById('bubbles');
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 60 + 20;
      b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}vw;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*10}s;`;
      bubblesContainer.appendChild(b);
    }

    // Bintang
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-duration:${Math.random()*3+1.5}s;animation-delay:${Math.random()*4}s;`;
      starsContainer.appendChild(s);
    }

    // Konfeti
    const confettiColors = ['#ffe066','#ff9f43','#00c6ff','#ffffff','#a29bfe','#fd79a8','#55efc4','#fdcb6e'];
    function launchConfetti() {
      const container = document.getElementById('confetti');
      container.innerHTML = '';
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const size = Math.random() * 10 + 6;
        piece.style.cssText = `left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${confettiColors[Math.floor(Math.random()*confettiColors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*1.5}s;`;
        container.appendChild(piece);
      }
      setTimeout(() => { container.innerHTML = ''; }, 5500);
    }

    window.addEventListener('load', () => setTimeout(launchConfetti, 800));
  </script>
</body>
</html>
